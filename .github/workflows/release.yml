name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GH_CLI_VERSION: "2.93.0"
  GH_CLI_LINUX_AMD64_SHA256: "02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: verify-and-build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install checksummed GitHub CLI
        shell: bash
        run: |
          gh_archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$gh_archive"
          printf '%s  %s\n' \
            "$GH_CLI_LINUX_AMD64_SHA256" \
            "$gh_archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$gh_archive" --directory "$RUNNER_TEMP"
          gh_bin_dir="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          test "$("$gh_bin_dir/gh" --version | awk 'NR == 1 { print $3 }')" = "$GH_CLI_VERSION"
          printf '%s\n' "$gh_bin_dir" >> "$GITHUB_PATH"
      - name: Confirm the checksummed GitHub CLI is selected
        shell: bash
        run: test "$(gh --version | awk 'NR == 1 { print $3 }')" = "$GH_CLI_VERSION"
      - name: Confirm the annotated tag points to the checked-out commit
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Require GitHub verification of the signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object.type'
          )" = "tag"
          tag_object="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object.sha'
          )"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME")" = "$tag_object"
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.tag'
          )" = "$GITHUB_REF_NAME"
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.verification.verified'
          )" = "true"
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.verification.reason'
          )" = "valid"
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.object.sha'
          )" = "$GITHUB_SHA"
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.object.type'
          )" = "commit"
      - name: Require the signed tag target to be on protected main history
        shell: bash
        run: |
          git fetch \
            --force \
            --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Confirm the verified tag matches the project version
        shell: bash
        run: |
          project_version="$(
            python -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "$GITHUB_REF_NAME" = "v${project_version}"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium webkit
      - run: make verify
      - name: Build deterministic source and stage artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=dist
          assets="$bundle/assets"
          mkdir -p "$assets"
          git archive --format=tar --prefix="type-s-m-calibrator-${GITHUB_REF_NAME}/" HEAD |
            gzip -n > "$assets/type-s-m-calibrator-${GITHUB_REF_NAME}.tar.gz"
          cp web/assets/py/manifest.json \
            "$assets/browser-stage-manifest-${GITHUB_REF_NAME}.json"
          (
            cd "$assets"
            sha256sum *.json *.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > "$bundle/release-notes.md"
          grep -q '[^[:space:]]' "$bundle/release-notes.md"
      - name: Transfer the complete release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: verify-and-build
    permissions:
      contents: write # Required only to create and publish the verified release.
      attestations: read # Required to verify the immutable release and asset attestations.
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist
      - name: Recheck the transferred release bundle
        shell: bash
        run: |
          test "$(find dist/assets -maxdepth 1 -type f | wc -l)" -eq 3
          grep -q '[^[:space:]]' dist/release-notes.md
          cd dist/assets
          sha256sum --check SHA256SUMS
      - name: Install checksummed GitHub CLI
        shell: bash
        run: |
          gh_archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$gh_archive"
          printf '%s  %s\n' \
            "$GH_CLI_LINUX_AMD64_SHA256" \
            "$gh_archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$gh_archive" --directory "$RUNNER_TEMP"
          gh_bin_dir="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          test "$("$gh_bin_dir/gh" --version | awk 'NR == 1 { print $3 }')" = "$GH_CLI_VERSION"
          printf '%s\n' "$gh_bin_dir" >> "$GITHUB_PATH"
      - name: Confirm the checksummed GitHub CLI is selected
        shell: bash
        run: test "$(gh --version | awk 'NR == 1 { print $3 }')" = "$GH_CLI_VERSION"
      - name: Require repository release immutability
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: |
          test "$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq .enabled
          )" = "true"
      - name: Create a draft release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/assets/* \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
      - name: Verify the draft and downloaded assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "false"
          gh release view "$GITHUB_REF_NAME" --json body > "$RUNNER_TEMP/release-body.json"
          jq --exit-status --join-output '.body' \
            "$RUNNER_TEMP/release-body.json" \
            > "$RUNNER_TEMP/release-body.md"
          cmp --silent dist/release-notes.md "$RUNNER_TEMP/release-body.md"
          expected_assets="$(find dist/assets -maxdepth 1 -type f -exec basename {} \; | sort)"
          actual_assets="$(
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort
          )"
          test "$expected_assets" = "$actual_assets"
          mkdir remote-dist
          gh release download "$GITHUB_REF_NAME" --dir remote-dist
          diff --recursive --brief dist/assets remote-dist
          cd remote-dist
          sha256sum --check SHA256SUMS
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "false"
          gh release verify "$GITHUB_REF_NAME"
          for asset in remote-dist/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset"
          done
