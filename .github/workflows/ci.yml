name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make fmt-check
      - run: make lint
      - run: make test
      - name: Generated stage stays ignored and tracked files stay clean
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  e2e-chromium:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium
          path: test-results
          if-no-files-found: ignore

  e2e-webkit-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps webkit
      - run: make e2e-webkit-smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit
          path: test-results-webkit
          if-no-files-found: ignore
