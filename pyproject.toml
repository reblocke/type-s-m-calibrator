[project]
name = "scientific-applet-template-package"
version = "0.1.0"
description = "Reusable client-side Python scaffold for a focused scientific applet"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Brian Locke" },
]
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "playwright>=1.55,<2",
  "pytest>=8.2,<9",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.15.1,<1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["template_applet"]
