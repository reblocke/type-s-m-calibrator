[project]
name = "type-s-m-calibrator"
version = "0.1.3"
description = "Forward Type S and Type M design calibration under one-parameter Wald models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brian Locke" },
]
maintainers = [
  { name = "Brian Locke" },
]
keywords = [
  "type-s-error",
  "type-m-error",
  "design-calibration",
  "wald-inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "wald-inference @ https://github.com/reblocke/wald-inference-core/releases/download/v0.4.1/wald_inference-0.4.1-py3-none-any.whl#sha256=d7272023f65088729d3ff997cab7cac57b84f22ac6108244ec2170434557d99b",
]

[project.urls]
Repository = "https://github.com/reblocke/type-s-m-calibrator"
Issues = "https://github.com/reblocke/type-s-m-calibrator/issues"
Documentation = "https://github.com/reblocke/type-s-m-calibrator/blob/main/docs/SCIENTIFIC_SCOPE.md"
Hosted = "https://reblocke.github.io/type-s-m-calibrator/"

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "playwright>=1.55,<2",
  "pytest>=8.2,<9",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.15.1,<1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["type_sm_calibrator"]
